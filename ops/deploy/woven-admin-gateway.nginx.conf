user www-data;
worker_processes 1;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 128;
}

http {
    access_log off;
    server_tokens off;
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;

    server {
        listen 10.128.0.2:8443 ssl;
        server_name api.woven.host;

        ssl_certificate /etc/woven/tls/current/fullchain.pem;
        ssl_certificate_key /etc/woven/tls/current/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:WOVEN_TLS:1m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        location = /metrics {
            limit_except GET {
                deny all;
            }
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host 127.0.0.1;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
            proxy_pass http://127.0.0.1:8080/metrics;
        }

        location ^~ /v1/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host 127.0.0.1;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
            proxy_pass http://127.0.0.1:8083;
        }

        location / {
            return 404;
        }
    }
}
