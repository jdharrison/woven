[workspace]
members = [
    "crates/woven-core",
    "crates/woven-protocol",
    "crates/woven-server",
    "crates/woven-transport",
    "crates/woven-transport-quic",
    "crates/woven-client-rust",
    "crates/woven-loadtest",
    "crates/woven-inference-core",
    "crates/woven-inference-tools",
    "crates/woven-inference-test-provider",
    "crates/woven-inference-coordinator",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/jdharrison/woven"

[workspace.dependencies]
# Core protocol dependencies
flatbuffers = "=25.12.19"
# Cargo ignores SemVer build metadata in requirements; Cargo.lock pins the
# matching FlatBuffers 25.12.19 build/compiler artifacts.
flatbuffers-build = "=0.2.4"
flatc-fork = "=0.6.0"
# Internal crates
woven-core = { path = "crates/woven-core", version = "0.2.0" }
woven-protocol = { path = "crates/woven-protocol", version = "0.1.2" }
woven-transport = { path = "crates/woven-transport", version = "0.2.0" }
woven-transport-quic = { path = "crates/woven-transport-quic", version = "0.2.0" }
woven-inference-core = { path = "crates/woven-inference-core", version = "0.2.0" }
woven-inference-tools = { path = "crates/woven-inference-tools", version = "0.2.0" }
woven-inference-test-provider = { path = "crates/woven-inference-test-provider", version = "0.2.0" }
woven-inference-coordinator = { path = "crates/woven-inference-coordinator", version = "0.2.0" }
# Async runtime
tokio = { version = "1.53", features = ["full"] }
async-trait = "0.1"
# QUIC + TLS
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
wtransport = { version = "=0.7.2", features = ["dangerous-configuration"] }
# HTTP control plane
axum = { version = "0.8" }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.7", features = ["trace"] }
url = "2"
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[workspace.lints.rust]
# Handwritten crates deny unsafe code. The protocol crate locally allows it only
# inside private bindings generated by the pinned FlatBuffers compiler.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
