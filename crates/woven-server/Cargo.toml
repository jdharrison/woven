[package]
name = "woven-server"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
description = "Self-hosted QUIC and WebTransport realtime server for Woven"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["realtime", "quic", "webtransport"]
categories = ["network-programming"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "woven-server"
path = "src/main.rs"

[dependencies]
ring = "=0.17.14"
serde_json.workspace = true
woven-core.workspace = true
woven-protocol.workspace = true
woven-transport.workspace = true
woven-transport-quic.workspace = true
woven-inference-core.workspace = true
woven-inference-tools.workspace = true
woven-inference-test-provider.workspace = true
woven-inference-coordinator.workspace = true
axum.workspace = true
tokio.workspace = true
serde.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tower-http.workspace = true
rcgen.workspace = true
quinn.workspace = true
rustls.workspace = true
wtransport.workspace = true
url.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[dev-dependencies]
woven-client = { path = "../woven-client-rust", version = "0.2.0" }
tower.workspace = true

[lints]
workspace = true
