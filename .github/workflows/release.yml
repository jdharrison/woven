name: Release

on:
  push:
    tags:
      - "release/*/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing artifact release tag, for example release/woven-core/v0.1.1-alpha.1
        required: true
        type: string
      confirm:
        description: Type publish to confirm registry publication
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Verify artifact release tag and version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      artifact: ${{ steps.release.outputs.artifact }}
    steps:
      - name: Resolve requested artifact release
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$CONFIRM" != "publish" ]; then
            echo "Manual releases require confirm=publish." >&2
            exit 1
          fi

          TAG="${INPUT_TAG:-$REF_NAME}"
          if ! printf '%s' "$TAG" | grep -Eq '^release/(woven-core|woven-protocol|woven-transport|woven-transport-quic|woven-inference-core|woven-inference-tools|woven-inference-test-provider|woven-inference-coordinator|woven-client|woven-server|npm-woven-client)/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "Release tag must use release/<artifact>/vX.Y.Z SemVer form: $TAG" >&2
            exit 1
          fi

          RELEASE="${TAG#release/}"
          ARTIFACT="${RELEASE%%/*}"
          VERSION="${RELEASE#*/v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate release contents
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
      - name: Confirm exact tag checkout
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$(git rev-parse HEAD)"
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/woven-client-ts/package-lock.json
      - name: Verify selected artifact version
        env:
          ARTIFACT: ${{ needs.prepare.outputs.artifact }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          case "$ARTIFACT" in
            woven-core) MANIFEST=crates/woven-core/Cargo.toml ;;
            woven-protocol) MANIFEST=crates/woven-protocol/Cargo.toml ;;
            woven-transport) MANIFEST=crates/woven-transport/Cargo.toml ;;
            woven-transport-quic) MANIFEST=crates/woven-transport-quic/Cargo.toml ;;
            woven-inference-core) MANIFEST=crates/woven-inference-core/Cargo.toml ;;
            woven-inference-tools) MANIFEST=crates/woven-inference-tools/Cargo.toml ;;
            woven-inference-test-provider) MANIFEST=crates/woven-inference-test-provider/Cargo.toml ;;
            woven-inference-coordinator) MANIFEST=crates/woven-inference-coordinator/Cargo.toml ;;
            woven-client) MANIFEST=crates/woven-client-rust/Cargo.toml ;;
            woven-server) MANIFEST=crates/woven-server/Cargo.toml ;;
            npm-woven-client) MANIFEST=crates/woven-client-ts/package.json ;;
            *) echo "Unsupported artifact: $ARTIFACT" >&2; exit 1 ;;
          esac

          MANIFEST="$MANIFEST" python3 - <<'PY'
          import json
          import os
          import sys
          import tomllib

          manifest = os.environ["MANIFEST"]
          expected = os.environ["VERSION"]
          with open(manifest, "rb") as source:
              package = json.load(source) if manifest.endswith(".json") else tomllib.load(source)
          actual = package["version"] if manifest.endswith(".json") else package["package"]["version"]
          if actual != expected:
              print(f"{manifest}: expected {expected}, found {actual!r}", file=sys.stderr)
              sys.exit(1)
          PY
      - name: Install TypeScript dependencies
        working-directory: crates/woven-client-ts
        run: npm ci
      - name: Validate Rust workspace
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets --all-features
          cargo build --locked --workspace
      - name: Validate TypeScript package
        working-directory: crates/woven-client-ts
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test
          npm run build

  security-audit:
    name: Audit release dependencies
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install cargo-audit with its compatible toolchain
        run: cargo +1.88.0 install cargo-audit --version 0.22.2 --locked
      - name: Audit dependencies
        run: cargo audit

  publish:
    name: Publish selected artifact
    needs: [prepare, validate, security-audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: crates/woven-client-ts/package-lock.json
          registry-url: https://registry.npmjs.org
      - name: Refuse existing selected registry version
        env:
          ARTIFACT: ${{ needs.prepare.outputs.artifact }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          case "$ARTIFACT" in
            npm-woven-client) REGISTRY_URL="https://registry.npmjs.org/%40signalweave%2Fwoven-client/$VERSION" ;;
            *) REGISTRY_URL="https://crates.io/api/v1/crates/$ARTIFACT/$VERSION" ;;
          esac

          status="$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' --user-agent 'woven-release-check/1.0' "$REGISTRY_URL")" || {
            echo "Unable to check the registry for $ARTIFACT $VERSION." >&2
            exit 1
          }
          case "$status" in
            200)
              echo "Registry already contains $ARTIFACT $VERSION; releases are immutable." >&2
              exit 1
              ;;
            404) ;;
            *)
              echo "Registry returned HTTP $status for $ARTIFACT $VERSION; refusing to publish." >&2
              exit 1
              ;;
          esac
      - name: Publish selected Rust crate
        if: needs.prepare.outputs.artifact != 'npm-woven-client'
        env:
          ARTIFACT: ${{ needs.prepare.outputs.artifact }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" || { echo "CARGO_REGISTRY_TOKEN is required for crates.io publication." >&2; exit 1; }
          cargo publish --locked -p "$ARTIFACT"
      - name: Publish TypeScript browser client
        if: needs.prepare.outputs.artifact == 'npm-woven-client'
        working-directory: crates/woven-client-ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo "NPM_TOKEN is required for npm publication." >&2; exit 1; }
          npm ci
          npm run build
          npm publish --provenance --access public

  binaries:
    if: needs.prepare.outputs.artifact == 'woven-server'
    name: Build ${{ matrix.target }} server binary
    needs: [prepare, validate, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: woven-server-v${{ needs.prepare.outputs.version }}-x86_64-unknown-linux-musl.tar.gz
            binary: woven-server
            format: tar.gz

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build server
        run: cargo build --locked --release --target ${{ matrix.target }} -p woven-server
      - name: Package Unix archive
        if: matrix.format == 'tar.gz'
        env:
          ARCHIVE: ${{ matrix.archive }}
          BINARY: ${{ matrix.binary }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p release/woven-server
          cp "target/$TARGET/release/$BINARY" release/woven-server/
          cp LICENSE release/woven-server/
          cp README.md release/woven-server/README.md
          tar -czf "$ARCHIVE" -C release woven-server
      - name: Package Windows archive
        if: matrix.format == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/woven-server | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" release/woven-server/
          Copy-Item LICENSE release/woven-server/
          Copy-Item README.md release/woven-server/README.md
          Compress-Archive -Path release/woven-server -DestinationPath ${{ matrix.archive }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release-assets:
    if: needs.prepare.outputs.artifact == 'woven-server'
    name: Upload release assets
    needs: [prepare, publish, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum woven-server-* > woven-server-v${{ needs.prepare.outputs.version }}-checksums.txt
      - name: Create the release for manual dispatch when needed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes --target "$GITHUB_SHA"
      - name: Upload binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" --clobber release-assets/*
