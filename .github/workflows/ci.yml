name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Test deployment tooling
        run: python3 -m unittest discover -s ops/deploy -p 'test_*.py'
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-targets --all-features
      - name: Build
        run: cargo build --locked --workspace

  security-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install cargo-audit with its compatible toolchain
        run: cargo +1.88.0 install cargo-audit --version 0.22.2 --locked
      - name: Audit dependencies
        run: cargo audit

  client-ts:
    name: TypeScript browser client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/woven-client-ts/package-lock.json
      - name: Install dependencies
        working-directory: crates/woven-client-ts
        run: npm ci
      - name: Check formatting
        working-directory: crates/woven-client-ts
        run: npm run format:check
      - name: Lint
        working-directory: crates/woven-client-ts
        run: npm run lint
      - name: Type-check
        working-directory: crates/woven-client-ts
        run: npm run typecheck
      - name: Test
        working-directory: crates/woven-client-ts
        run: npm run test
      - name: Build package
        working-directory: crates/woven-client-ts
        run: npm run build
